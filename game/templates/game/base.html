{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}bash-dash{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'game/game.css' %}">
</head>
<body>
  <main class="{% block main_class %}{% endblock %}">
    <div class="page">
    {% block header %}<header class="brand">
      <span class="brand-name"><span class="dollar">$</span><span class="gradient-text">bash-dash</span></span>
      {% block badge %}{% endblock %}
    </header>{% endblock %}
    {% block content %}{% endblock %}
    </div>
    {% block sponsor %}<a class="sponsor" href="https://camlingroup.com/" target="_blank" rel="noopener">
      <img src="{% static 'game/camlin-logo.png' %}" alt="Camlin Group" width="66" height="22">
      <span>camlingroup.com</span>
    </a>{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
